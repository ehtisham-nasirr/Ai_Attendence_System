# CI (requirements §18): lint, type checks, unit/integration tests and container scanning on every push.
# Staging deploy on tag and the manual production approval need the organisation's registry and
# runners; they are not defined here (docs/open-questions.md P13).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: common
            mypy_target: facetrack_common
            sync: uv sync --all-extras
          - package: engine
            mypy_target: app
            sync: uv sync
          - package: backend
            mypy_target: app
            sync: uv sync
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: facetrack
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: facetrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U facetrack" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://facetrack:ci-only-password@localhost:5432/facetrack_test
      TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install WeasyPrint system libraries
        if: matrix.package == 'backend'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - run: ${{ matrix.sync }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy ${{ matrix.mypy_target }}
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  monitoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make check-monitoring
      - name: Compose files are valid
        working-directory: infra
        run: |
          cp .env.example .env
          cp env/backend.env.example env/backend.env
          cp env/engine.env.example env/engine.env
          docker compose config -q
          docker compose -f docker-compose.engine.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

  images:
    needs: [python, frontend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: engine
            context: .
            file: engine/Dockerfile
          - name: nginx
            context: .
            file: infra/nginx/Dockerfile
          - name: backup
            context: infra/backup
            file: infra/backup/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t facetrack/${{ matrix.name }}:ci -f ${{ matrix.file }} ${{ matrix.context }}
      - name: Scan (Trivy, fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: facetrack/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
