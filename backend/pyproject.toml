[project]
name = "facetrack-backend"
version = "0.1.0"
description = "FaceTrack backend: REST API, WebSockets, attendance rules, Celery jobs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "facetrack-common[s3]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "ldap3>=2.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.3",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "weasyprint>=62",
    "jinja2>=3.1",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis]>=4.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "celery-types",
]

[tool.uv.sources]
facetrack-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PL"]
# N818: standards/09 names the domain exceptions (NotFound, PermissionDenied, Conflict, ...).
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "E501"]
"app/scripts/**" = ["T201", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ldap3.*", "weasyprint.*", "xlsxwriter.*", "openpyxl.*", "minio.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
# SQLAlchemy's async layer runs code in greenlets; without this, coverage under-reports.
concurrency = ["greenlet", "thread"]
source = ["app"]
