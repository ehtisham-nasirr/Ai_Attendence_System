user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    log_format main escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"request_id":"$request_id"}';
    # Query strings are not logged: live-view tokens and filters stay out of the access log.
    access_log /dev/stdout main;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Login, reset and API keys are also rate-limited in the backend (Redis); this guards Nginx itself.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

    include /etc/nginx/conf.d/*.conf;
}
