[project]
name = "facetrack-engine"
version = "0.1.0"
description = "FaceTrack recognition engine (CPU only): adaptive camera modes, detection, tracking, best-crop embedding, matching."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "facetrack-common[s3]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "av>=12.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    # CPU-only inference runtimes (standards/17 §5): never the -gpu variants.
    "onnxruntime>=1.18",
    "openvino>=2024.0",
    "faiss-cpu>=1.8",
    # ByteTrack is deprecated in supervision 0.28 and removed in 0.31 (see docs/open-questions.md).
    "supervision>=0.22,<0.31",
    "redis>=5.0",
    "psutil>=5.9",
    "prometheus-client>=0.20",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-psutil",
]
tools = [
    # Post-training INT8 quantisation for OpenVINO (scripts/convert_int8.py).
    "nncf>=2.12",
]

[tool.uv]
# supervision depends on opencv-python (GUI build); the headless build provides the same cv2 module,
# so the GUI wheel is excluded to avoid two conflicting cv2 installs.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.sources]
facetrack-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Tests and scripts import heavy modules lazily on purpose and favour readable long assertions.
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "E501"]
"scripts/**" = ["S311", "T201", "PLC0415", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["av.*", "faiss.*", "supervision.*", "openvino.*", "onnxruntime.*", "minio.*", "nncf.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "scripts"]
markers = ["models: needs downloaded model files (skipped otherwise)"]
