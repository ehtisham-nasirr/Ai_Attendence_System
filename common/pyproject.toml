[project]
name = "facetrack-common"
version = "0.1.0"
description = "FaceTrack shared package: SQLAlchemy models, Pydantic schemas, recognition-event contract, constants."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.30,<2.2",
    "pydantic>=2.7",
    "cryptography>=42.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# S3-compatible object storage backend (storage.S3ObjectStore).
s3 = ["minio>=7.2"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facetrack_common"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["minio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
