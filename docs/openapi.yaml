  /api/v1/employees/{employee_id}:
    get:
      tags:
      - employees
      summary: Get an employee
      operationId: get_employee
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: integer
          title: Employee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmployeeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - employees
      summary: Update Employee
      description: Setting status to inactive stops recognition immediately (FR-13).
      operationId: update_employee
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: integer
          title: Employee Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmployeeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - employees
      summary: Delete an employee and permanently erase their face data
      description: 'FR-13: the record is soft-deleted (attendance history stays) and
        all biometric data is hard-deleted.

        `confirm_employee_code` must equal the employee''s code.'
      operationId: delete_employee
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: integer
          title: Employee Id
      - name: confirm_employee_code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Confirm Employee Code
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/employees/{employee_id}/biometrics:
    delete:
      tags:
      - employees
      summary: Erase all face data of an employee (right to erasure)
      description: 'Super Admin only. Hard-deletes enrollments, photos, embeddings,
        event snapshots and assigned

        unknown faces, writes an audit entry (without the data) and reloads the gallery.
        Body must

        confirm the employee code.'
      operationId: erase_biometrics
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: integer
          title: Employee Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiometricErasure'
